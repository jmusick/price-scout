# Publishes a GitHub Release for each pushed vX.Y.Z tag (for example from /release), through the
# jmusick/ci release workflow. The release carries PriceScout-X.Y.Z.zip, the file to upload to Nexus
# Mods: PriceScout.ba2 and an install readme, with the archive root as the game's Data folder.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the tag to match PriceScout.BUILD
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $match = Select-String -Path src/scripts/PriceScout.as -Pattern 'BUILD:String\s*=\s*"([^"]+)"'
          if (-not $match) { throw "BUILD not found in src/scripts/PriceScout.as" }
          $build = $match.Matches[0].Groups[1].Value
          if ("v$build" -ne $env:TAG) {
            Write-Host "::error::Tag $env:TAG does not match PriceScout.BUILD $build."
            exit 1
          }

      - name: Set up JPEXS
        id: jpexs
        uses: ./.github/actions/setup-jpexs

      - name: Build
        shell: pwsh
        env:
          FFDEC: ${{ steps.jpexs.outputs.ffdec }}
        run: ./build.ps1 -Ffdec $env:FFDEC

      - name: Package
        shell: pwsh
        run: ./package.ps1

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/PriceScout-*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Release
    needs: build
    permissions:
      contents: write
    uses: jmusick/ci/.github/workflows/release.yml@a8ac9c292577382c63e5a38af58d38a4cd6f8504 # v0.3.0
    with:
      artifact-name: release-files
      title: PriceScout ${{ github.ref_name }}
